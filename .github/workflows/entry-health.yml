name: entry-health

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve every linked repo through the API
        id: health
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/entry-health.mjs

      - name: Open or update one advisory issue
        if: steps.health.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(printf 'The weekly API pass found these. A link check cannot see any of it, because a rename and an archive both return 200.\n\n```\n%s\n```\n' "$(cat entry-health.txt)")
          existing=$(gh issue list --state open --search 'in:title "Entry health"' --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Entry health: renames, archives, and missing repos" --body "$body"
          fi
